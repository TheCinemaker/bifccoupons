name: Banggood API to Google Sheets Sync (2 óránként)

on:
  schedule:
    # Kétóránként, a páros órák 00. percében
    - cron: '0 */2 * * *'
  workflow_dispatch:
    # Kézi indítási lehetőség a GitHub felületén

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Banggood Sync Script
        env:
          BANGGOOD_API_KEY: ${{ secrets.BANGGOOD_API_KEY }}
          BANGGOOD_API_SECRET: ${{ secrets.BANGGOOD_API_SECRET }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          node backend/syncBanggood.js
