    <!--
      Téma beállítása MÉG a React betöltése előtt.
      Enélkül a mentett világos mód esetén egy pillanatra felvillanna a sötét háttér.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('kvm-theme');
          var theme = (saved === 'light' || saved === 'dark')
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.backgroundColor = theme === 'light' ? '#f0f0f3' : '#08090b';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#fafafc' : '#101114');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
